name: Deploy Broadsheet Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 build_standalone.py
        env:
          GOOGLE_MAPS_BROWSER_KEY: ${{ vars.GOOGLE_MAPS_BROWSER_KEY }}
          BROADSHEET_API_BASE: ${{ vars.BROADSHEET_API_BASE }}
      - run: npm test
      - run: node --check dist/app.js && node --check dist/model.js && node --check dist/canvas.js && node --check dist/spatial.js && node --check dist/spaces.js && node --check dist/browse.js && node --check dist/hub.js && node --check dist/live.js && node --check dist/config.js && node --check dist/immersive.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
